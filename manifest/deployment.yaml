apiVersion: apps/v1
kind: Deployment
metadata:
  name: logsbench
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logsbench
  template:
    metadata:
      labels:
        app: logsbench
    spec:
      containers:
        - name: logsbench
          image: localhost:5001/logbench:latest
          imagePullPolicy: Always
          command:
            - logbench
            - -batch-size
            - "500"
            - -ops
            - "5000"
            - -endpoint
            - http://mycluster-frontend.default.svc.cluster.local:4000
            - -db
            - public
            - -cluster-num
            - "40"
            - -app-num
            - "50"
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: "2"
              memory: "4Gi"
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: CONTAINER_NAME
            value: logsbench
          - name: APP_NAME
            value: logsbench
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
